<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Verificador de Originalidad Académica — VicTesis Lab">
  <desc>Sello de integridad académica: aro dorado giratorio sobre fondo azul marino, con un libro abierto y una lupa de barrido.</desc>

  <!-- Aro exterior azul marino -->
  <circle cx="50" cy="50" r="47" fill="#1e3a5f" />

  <!-- Aro dorado discontinuo que gira (sugiere escaneo) -->
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#c9a227" stroke-width="3" stroke-dasharray="7 6">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="14s" repeatCount="indefinite" />
  </circle>

  <!-- Destello que recorre el aro -->
  <circle cx="50" cy="6.5" r="2.4" fill="#fde68a">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="14s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.15;1;0.15;0.15" keyTimes="0;0.78;0.88;0.98;1" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Disco central claro -->
  <circle cx="50" cy="50" r="36" fill="#f8fafc" />

  <!-- Libro abierto estilizado -->
  <g stroke="#1e3a5f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 40c-5.5-3.6-12-4.6-17.5-2.8v18.4c5.5-1.8 12-0.8 17.5 2.8" />
    <path d="M50 40c5.5-3.6 12-4.6 17.5-2.8v18.4c-5.5-1.8-12-0.8-17.5 2.8" />
    <line x1="50" y1="40" x2="50" y2="58.4" />
  </g>

  <!-- Lupa con leve barrido, superpuesta sobre el libro -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 61 54;7 61 54;0 61 54" keyTimes="0;0.5;1" dur="4.5s" repeatCount="indefinite" />
    <circle cx="61" cy="54" r="7.5" fill="rgba(248,250,252,0.85)" stroke="#c9a227" stroke-width="3" />
    <line x1="66.3" y1="59.3" x2="72" y2="65" stroke="#c9a227" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
